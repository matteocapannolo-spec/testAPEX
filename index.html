<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX</title>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.cdnfonts.com https://fonts.googleapis.com; font-src https://fonts.cdnfonts.com https://fonts.gstatic.com; img-src 'self' data: https:; base-uri 'self'; form-action 'self'">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23000000'/><path d='M 50,18 L 20,82 L 33,82 L 50,44 L 60,66 L 73,66 L 50,18 Z M 64,74 L 70,82 L 83,82 L 64,74 Z' fill='%23ffffff'/></svg>">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <link rel="stylesheet" href="core/core.css">
    <link rel="stylesheet" href="portale/portale.css">
</head>
<body>

    <svg class="sprite-icone" aria-hidden="true" focusable="false">
        <symbol id="i-asset" viewBox="0 0 24 24">
            <path d="M12 0.9c0.85 6.75 4.35 10.25 11.1 11.1 -6.75 0.85 -10.25 4.35 -11.1 11.1 -0.85 -6.75 -4.35 -10.25 -11.1 -11.1 6.75 -0.85 10.25 -4.35 11.1 -11.1Z"/>
        </symbol>

        <symbol id="i-progetti" viewBox="0 0 24 24">
            <path d="M12 1.8A10.2 10.2 0 0 1 21.59 8.51L18.39 9.67A6.8 6.8 0 0 0 12 5.2Z"/>
            <path d="M12 1.8A10.2 10.2 0 0 1 21.59 8.51L18.39 9.67A6.8 6.8 0 0 0 12 5.2Z" transform="rotate(120 12 12)"/>
            <path d="M12 1.8A10.2 10.2 0 0 1 21.59 8.51L18.39 9.67A6.8 6.8 0 0 0 12 5.2Z" transform="rotate(240 12 12)"/>
        </symbol>

        <symbol id="i-formazione" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="12" cy="3.4" r="2"/>
            <circle cx="18.08" cy="5.92" r="2"/>
            <circle cx="20.6" cy="12" r="2"/>
            <circle cx="18.08" cy="18.08" r="2"/>
            <circle cx="12" cy="20.6" r="2"/>
            <circle cx="5.92" cy="18.08" r="2"/>
            <circle cx="3.4" cy="12" r="2"/>
            <circle cx="5.92" cy="5.92" r="2"/>
        </symbol>

        <symbol id="i-admin" viewBox="0 0 24 24">
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9"/>
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9" transform="rotate(45 12 12)"/>
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9" transform="rotate(90 12 12)"/>
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9" transform="rotate(135 12 12)"/>
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9" transform="rotate(180 12 12)"/>
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9" transform="rotate(225 12 12)"/>
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9" transform="rotate(270 12 12)"/>
            <rect x="9.85" y="0.9" width="4.3" height="4.8" rx="0.9" transform="rotate(315 12 12)"/>
            <path fill-rule="evenodd" d="M12 4.4a7.6 7.6 0 1 1 0 15.2 7.6 7.6 0 0 1 0-15.2Zm0 4.3a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Z"/>
        </symbol>

        <symbol id="i-default" viewBox="0 0 24 24">
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3"/>
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3" transform="rotate(45 12 12)"/>
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3" transform="rotate(90 12 12)"/>
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3" transform="rotate(135 12 12)"/>
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3" transform="rotate(180 12 12)"/>
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3" transform="rotate(225 12 12)"/>
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3" transform="rotate(270 12 12)"/>
            <ellipse cx="12" cy="5.4" rx="1.9" ry="4.3" transform="rotate(315 12 12)"/>
            <circle cx="12" cy="12" r="2.6"/>
        </symbol>
    </svg>

    <div class="login-overlay" id="login" hidden>
        <div class="login-card">
            <div class="login-brand">
                <div class="login-logo">APEX</div>
                <div class="login-subtitle">Piattaforma gestionale</div>
                <div class="login-group-tag">
                    <img src="https://tt-group.it/wp-content/uploads/tt-group_logo_logotipo_n.svg" alt="tt group">
                </div>
            </div>

            <div class="login-action">
                <div id="loginErrore" class="login-error-msg" hidden></div>
                <button type="button" class="btn login-btn" data-action="login">
                    <img class="google-g-icon" src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="">
                    Accedi con Google
                </button>
            </div>
        </div>
    </div>

    <div id="portale" hidden>
        <header class="header">
            <div class="header-toprow">
                <div class="brand-container">
                    <div class="brand-name">APEX</div>
                    <div class="header-subtitle">Piattaforma gestionale di <img class="tt-logo-inline" src="https://tt-group.it/wp-content/uploads/tt-group_logo_logotipo_n.svg" alt="tt group"></div>
                </div>

                <div class="header-nav">
                    <div class="user-profile-wrapper">
                        <div class="avatar-btn" id="utenteAvatar" data-action="profilo" title="Profilo utente">
                            <span id="utenteIniziali">--</span>
                        </div>

                        <div class="profile-dropdown" id="menuProfilo" hidden>
                            <div class="profile-user-card">
                                <div class="avatar-btn avatar-large" id="utenteAvatarGrande">
                                    <span id="utenteInizialiGrandi">--</span>
                                </div>
                                <div class="profile-user-details">
                                    <div class="profile-name" id="utenteNome"></div>
                                    <div class="profile-email" id="utenteEmail"></div>
                                    <div class="profile-role-badge" id="utenteBadge" hidden></div>
                                </div>
                            </div>

                            <div class="profile-menu-item" data-action="tema">
                                <span class="material-symbols-outlined" id="iconaTema">dark_mode</span>
                                <span id="testoTema">Modalità Scura</span>
                            </div>

                            <div class="profile-menu-item danger" data-action="logout">
                                <span class="material-symbols-outlined">logout</span>
                                <span>Disconnetti Account</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="portale-corpo">
            <h1>I tuoi moduli</h1>
            <p class="sottotitolo">Apri il modulo su cui vuoi lavorare.</p>
            <div class="moduli" id="moduli"></div>
        </main>
    </div>

    <script type="module" src="portale/main.js"></script>
</body>
</html>
